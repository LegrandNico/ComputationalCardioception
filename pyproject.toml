[project]
name = "ComputationalCardioception"
version = "0.0.1"
description = "Computational models of cardiac beliefs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0.0",
    "pyhgf>=0.3.0",
    "pymc>=5.25.0",
    "matplotlib>=3.10.1",
    "pandas>=2.1.3",
    "scipy>=1.12.1",
    "ipywidgets",
    "numba>=0.61.0",
    "nutpie>=0.16.10",
    "pre-commit>=4.2.0",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.30.1",
    "watermark",
    "ruff",
    "pingouin",
    "tqdm",
    "ipykernel>=6.29.5",
]


[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
