[project]
name = "ComputationalCardioception"
version = "0.0.1"
description = "Computational models of cardiac beliefs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0.0",
    "pyhgf>=0.2.7",
    "matplotlib>=3.10.1",
    "pandas>=2.1.3",
    "scipy>=1.12.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "ipython>=9.0.2",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "watermark",
    "ruff",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
